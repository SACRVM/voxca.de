[install]
launcher_alt = "Der Launcher: die fünf Spiele, jedes mit PLAY und EDIT, darunter NEW GAME."
linux_silent = "Erscheint nichts, starte es wie oben aus einem Terminal: Dort steht, was fehlt. <code>GLIBC_2.39 not found</code> heißt, das System ist zu alt (Ubuntu 24.04, Linux Mint 22 und neuer gehen); die erste Zeile hiervon zeigt die Version:"
win_unblock = "Weniger Warnungen später: Klick vor dem Entpacken mit der rechten Maustaste auf die Zip-Datei, wähle <em>Eigenschaften</em>, setz unten den Haken bei <em>Zulassen</em> und drück <em>OK</em>."
win_browser = "Meldet der Browser, die Datei werde selten heruntergeladen, behalte sie: in Edge die drei Punkte daneben, <em>Beibehalten</em>, <em>Mehr anzeigen</em>, <em>Trotzdem beibehalten</em>."
title = "Installieren · Voxcade"
description = "Voxcade unter Windows und Linux, Schritt für Schritt: herunterladen, entpacken, doppelklicken."
heading = "So installierst du es"
lead = "Kein Installer, kein Konto: Voxcade ist ein Ordner. Herunterladen, entpacken, Voxcade doppelklicken. Fünf Minuten, Schritt für Schritt."
systems = "Dein System"
get_title = "Herunterladen"
unpack_title = "Entpacken"
start_title = "Voxcade starten"
warn_title = "Wenn Windows warnt"
ide_title = "Dann: Spiele machen"
network_title = "Dann: zusammen spielen"
win_get = "Lade die Zip-Datei herunter. Dein Browser legt sie in den Ordner Downloads."
win_unpack = "Öffne den Ordner Downloads, klick mit der rechten Maustaste auf die Zip-Datei und wähle <em>Alle extrahieren</em>, dann <em>Extrahieren</em>. Ein neuer Ordner mit demselben Namen öffnet sich, darin <code>voxcade</code>. Starte es von dort, nicht aus der Zip-Datei: Dort läuft es nicht."
win_start = "Doppelklick auf <code>voxcade</code> (Windows zeigt es vielleicht als <code>voxcade.exe</code>; als Typ steht <em>Anwendung</em> da). Der Launcher öffnet sich: PLAY neben einem Spiel startet es. Dahinter öffnet sich ein schwarzes Fenster: Es zeigt Meldungen und schließt sich mit Voxcade."
win_warn = "Beim ersten Mal meldet Windows vielleicht, es habe deinen PC geschützt: Voxcade ist noch nicht signiert. Klick auf <em>Weitere Informationen</em>, dann auf <em>Trotzdem ausführen</em> (der große Knopf, <em>Nicht ausführen</em>, würde es aufhalten). Windows merkt es sich."
win_ide = "Im Launcher öffnet EDIT ein Spiel in der IDE, der Werkstatt, in der Spiele entstehen, und NEW GAME beginnt ein eigenes. Der <a href=\"{{home}}quickstart.html\">Schnellstart</a> zeigt den Weg."
win_network = "Übers Internet muss nichts geöffnet werden. Willst du im Heimnetz hosten, fragt Windows beim ersten Mal, ob Voxcade ins Netz darf: Erlaube es für private Netzwerke (ein Administrator muss zustimmen). Aus Versehen abgebrochen? Windows-Sicherheit, <em>Firewall- &amp; Netzwerkschutz</em>, <em>Zugriff von App durch Firewall zulassen</em>."
linux_get = "Lade die tar.gz-Datei herunter."
linux_unpack = "Klick im Dateimanager mit der rechten Maustaste darauf und wähle <em>Hier entpacken</em>. Oder in einem Terminal, im Ordner mit der Datei:"
linux_start = "Öffne den neuen Ordner und doppelklick auf <code>start-voxcade.sh</code>. Zeigt der Dateimanager stattdessen den Text, klick mit der rechten Maustaste darauf und wähle <em>Als Programm ausführen</em>, oder erlaube das Ausführen in den Eigenschaften. Der Launcher öffnet sich: PLAY neben einem Spiel startet es. Oder in einem Terminal:"
linux_ide = "Im Launcher öffnet EDIT ein Spiel in der IDE, der Werkstatt, in der Spiele entstehen, und NEW GAME beginnt ein eigenes. Der <a href=\"{{home}}quickstart.html\">Schnellstart</a> zeigt den Weg."
linux_network = "Übers Internet muss nichts geöffnet werden. Willst du im Heimnetz hosten und eine Firewall ist an (ufw, wie unter Ubuntu), lass das Spiel herein:"
after_title = "Gut zu wissen"
keys_title = "Tasten und Gamepads"
keys_text = "Tastatur oder Gamepad. Jedes Spiel zeigt beim Start seine Tasten; alle zum Nachsehen und Ändern stehen unter Pause (Escape), EINSTELLUNGEN, STEUERUNG. Dort gibt es auch Lautstärke, Vollbild und Sprache. Die Menüs der Spiele sprechen Deutsch, der Launcher und die IDE Englisch."
update_title = "Eine neue Version"
update_text = "Der Launcher meldet, wenn es eine neue Version gibt. UPDATE NOW holt sie, prüft sie und setzt sie ein; was vorher da war, wandert in den Ordner <code>before-update</code>. Eigene Spiele, Einstellungen, Bestenlisten und Spielstände bleiben. Das Nachsehen lässt sich im Launcher abschalten."
remove_title = "Entfernen"
remove_text = "Lösch den Ordner. Die Einstellungen bleiben in <code>%APPDATA%\\voxcade</code> (Windows) oder <code>~/.config/voxcade</code> (Linux), bis du auch diesen löschst; eigene Spiele liegen in <code>Voxcade</code> in deinem Benutzerordner."
trouble_title = "Wenn es nicht startet"
trouble_text = "Liegt es an der Grafik, sagt Voxcade das in einem Fenster: Bring den Grafiktreiber auf den neuesten Stand. Läuft ein Spiel langsam, hilft EINSTELLUNGEN, BILD, SCHATTEN niedriger. Erscheint unter Linux gar nichts, starte es aus einem Terminal wie in Schritt 3."

[quick]
title = "Schnellstart · Voxcade"
description = "Dein erstes Spiel mit Voxcade in fünf Minuten: ein Jump and Run aus einer Vorlage, gespielt und verändert, Schritt für Schritt mit Bild."
heading = "Dein erstes Spiel in fünf Minuten"
lead = "Du machst ein Jump &amp; Run aus einer Vorlage, spielst es und änderst eine seiner Regeln. Sechs Schritte, jeder mit einem Bild von dem, was du siehst. Voxcade ist <a href=\"{{home}}install.html\">installiert</a>? Dann los."
s1_title = "Voxcade starten"
s1_text = "Doppelklick auf <code>voxcade</code> im Voxcade-Ordner (unter Linux <code>start-voxcade.sh</code>). Damit öffnet sich der Launcher."
s1_alt = "Der Launcher: die Spiele als Karten, unten links NEW GAME."
s2_title = "NEW GAME wählen"
s2_text = "Der Knopf steht unten links. Tipp einen Namen für dein Spiel, wähl JUMP &amp; RUN und dann CREATE."
s2_alt = "Das Formular NEW GAME: ein Name getippt, JUMP & RUN gewählt, darunter CREATE."
s3_title = "Dein Spiel öffnet sich"
s3_text = "Das ist die IDE, die Werkstatt, in der Spiele entstehen. Links stehen die Dateien deines Spiels; in der Mitte steht <code>main.lua</code>, die Datei mit seinen Regeln. Lesen musst du sie jetzt nicht."
s3_alt = "Die IDE: links die Dateien des Spiels, in der Mitte main.lua, oben rechts PLAY."
s4_title = "PLAY drücken"
s4_text = "Der Knopf steht oben rechts. Dein Spiel läuft dort, wo eben die Datei stand: ein Burgraum mit Held, Schleim, Fledermaus und Edelsteinen. Die Pfeiltasten laufen, die Leertaste springt. Spring auf den Schleim und sieh, wie hoch der Held abprallt."
s4_alt = "Das neue Spiel läuft in der IDE: ein Burgraum, links der Held, unten die Tasten."
s5_title = "Eine Regel ändern"
s5_text = "Drück Escape: Die Datei ist wieder da. In Zeile 11 steht, wie hoch der Held von einem Gegner abprallt. Mach aus 50 eine 150. Speichern musst du nicht, das macht die IDE von selbst."
s5_alt = "main.lua in der IDE, in Zeile 11 steht jetzt local BOUNCE = 150."
s6_title = "Wieder PLAY drücken"
s6_text = "Spring noch einmal auf den Schleim: Der Held fliegt jetzt dreimal so hoch. Du hast dein Spiel verändert."
done = "So arbeitest du immer: spielen, Escape, etwas ändern, wieder spielen. Jede Zahl mit Kommentar in <code>main.lua</code> und <code>conf.lua</code> darfst du ändern."
next_title = "Wie es weitergeht"
shape_title = "Das Aussehen ändern"
shape_text = "Doppelklick links auf <code>hero.vox</code> unter MODELS: Der Voxel-Editor öffnet sich in einem eigenen Fenster. Mal den Helden um; jede Änderung wird sofort gespeichert, und das Spiel zeigt sie."
level_title = "Den Raum bauen"
level_text = "Doppelklick auf <code>level.json</code> unter LEVELS: Der Level-Editor öffnet sich. Setz Blöcke, Edelsteine und Gegner."
share_title = "Weitergeben"
share_text = "BUILD oben rechts packt das Programm und dein Spiel in eine Zip-Datei im Ordner <code>builds</code> des Spiels, fertig zum Weitergeben."
help_title = "Mehr lernen"
help_text = "HELP oben rechts zeigt an Beispielen, was dein Code kann: ganze kleine Spiele zum Kopieren und Ändern. Die fünf Spiele, die Voxcade mitbringt, öffnest du im Launcher mit EDIT, um zu sehen, wie sie gemacht sind."

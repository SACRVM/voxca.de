[install]
launcher_alt = "The launcher: the five games, each with PLAY and EDIT, and NEW GAME below."
linux_silent = "If nothing appears, start it from a terminal as above: it says what is wrong. <code>GLIBC_2.39 not found</code> means the system is too old (Ubuntu 24.04, Linux Mint 22 and newer work); the first line of this shows the version:"
win_unblock = "Fewer warnings later: before unpacking, right-click the zip file, choose <em>Properties</em>, tick <em>Unblock</em> at the bottom and press <em>OK</em>."
win_browser = "If the browser says the file is not commonly downloaded, keep it: in Edge, the three dots beside it, <em>Keep</em>, <em>Show more</em>, <em>Keep anyway</em>."
title = "How to install · Voxcade"
description = "Voxcade on Windows and Linux, step by step: download, unpack, double-click."
heading = "How to install"
lead = "No installer, no account: Voxcade is a folder. Download it, unpack it, double-click Voxcade. Five minutes, step by step."
systems = "Your system"
get_title = "Download"
unpack_title = "Unpack"
start_title = "Start Voxcade"
warn_title = "If Windows warns"
ide_title = "Then: make games"
network_title = "Then: play together"
win_get = "Download the zip file. Your browser puts it in your Downloads folder."
win_unpack = "Open the Downloads folder, right-click the zip file and choose <em>Extract All</em>, then <em>Extract</em>. A new folder of the same name opens, with <code>voxcade</code> in it. Start it from there, not from inside the zip: there it cannot run."
win_start = "Double-click <code>voxcade</code> (Windows may show it as <code>voxcade.exe</code>; its type says <em>Application</em>). The launcher opens: PLAY beside a game starts it. A black window opens behind it: it shows messages and closes with Voxcade."
win_warn = "The first time, Windows may say it protected your PC: Voxcade is not signed yet. Click <em>More info</em>, then <em>Run anyway</em> (the big button, <em>Don&#39;t run</em>, would stop it). Windows remembers it."
win_ide = "In the launcher, EDIT opens a game in the IDE, the workshop where games are made, and NEW GAME begins one of your own. The <a href=\"{{home}}quickstart.html\">quick start</a> shows the way."
win_network = "Across the internet nothing needs opening. To host on the home network, Windows asks the first time whether Voxcade may use the network: allow it for private networks (an administrator has to agree). Cancelled by mistake? Windows Security, <em>Firewall &amp; network protection</em>, <em>Allow an app through firewall</em>."
linux_get = "Download the tar.gz file."
linux_unpack = "In your file manager, right-click it and choose <em>Extract Here</em>. Or in a terminal, in the folder you downloaded it to:"
linux_start = "Open the new folder and double-click <code>start-voxcade.sh</code>. If the file manager shows the text instead, right-click it and choose <em>Run as a Program</em>, or allow running it in its properties. The launcher opens: PLAY beside a game starts it. Or in a terminal:"
linux_ide = "In the launcher, EDIT opens a game in the IDE, the workshop where games are made, and NEW GAME begins one of your own. The <a href=\"{{home}}quickstart.html\">quick start</a> shows the way."
linux_network = "Across the internet nothing needs opening. To host on the home network with a firewall turned on (ufw, as on Ubuntu), let the game in:"
after_title = "Good to know"
keys_title = "Keys and pads"
keys_text = "A keyboard or a gamepad. Every game shows its keys as it begins; all of them, to look up and to change, are under pause (Escape), SETTINGS, CONTROLS. SETTINGS also has the volume, fullscreen and the language."
update_title = "A new version"
update_text = "The launcher says when a new version is there. UPDATE NOW fetches it, checks it and puts it in place; what was there before goes to the folder <code>before-update</code>. Your own games, settings, high scores and saves stay. Looking for new versions can be switched off in the launcher."
remove_title = "Removing it"
remove_text = "Delete the folder. Settings stay in <code>%APPDATA%\\voxcade</code> (Windows) or <code>~/.config/voxcade</code> (Linux) until you delete that too; games you made are in <code>Voxcade</code> in your home folder."
trouble_title = "If it will not start"
trouble_text = "If graphics are the trouble, Voxcade says so in a window: update your graphics driver. If the game runs slowly, SETTINGS, VIDEO, SHADOWS set lower helps. If nothing appears at all on Linux, start it from a terminal as in step 3."

[quick]
play_caption = "Your new game: the JUMP &amp; RUN template is a castle room with a hero, a slime, a bat and gems, yours to change."
title = "Quick start · Voxcade"
description = "Your first game with Voxcade in five minutes: a jump and run from a template, played and changed while it runs."
heading = "Your first game in five minutes"
lead = "From nothing to a jump &amp; run of your own: Voxcade makes the game from a template, you play it, and change it while it runs. Voxcade is <a href=\"{{home}}install.html\">installed</a>? Then off you go."
open_title = "Start Voxcade"
open_text = "Double-click <code>voxcade</code> in the Voxcade folder (<code>start-voxcade.sh</code> on Linux). The launcher opens, with the games to play and, below them, NEW GAME."
new_title = "A new game"
new_text = "Choose NEW GAME, type a name, pick JUMP &amp; RUN and choose CREATE. Your game opens in the IDE, the workshop where games are made. It is a folder of its own, in <code>Voxcade</code> in your home folder (the gear at the top right changes where)."
play_title = "Play it"
play_text = "Press PLAY at the top right. The game shows its keys: the arrows run, Space jumps. Land on the slime, take the gems, out through the door. Escape takes you back to the code."
play_alt = "The IDE with the new jump and run playing in the main area, its files on the left."
change_title = "Change a rule"
change_text = "On the left, <code>main.lua</code> holds the game&#39;s rules. Near the top stands how high the hero bounces off an enemy. Change 50 to 150: the IDE saves by itself a second later. Press PLAY again: the game goes on where it was, with the new rule. Jump on the slime and see."
change_alt = "main.lua open in the IDE, the rules at the top."
change_after = "Every number with a comment is yours to change; <code>conf.lua</code> holds the game's settings, from the hero's speed to the camera."
shape_title = "Shape it"
shape_text = "Double-click <code>hero.vox</code> under MODELS: the voxel editor opens in a window of its own. Paint the hero: every change is saved at once, and the game shows it. <code>level.json</code> under LEVELS opens the level editor: place blocks and things."
share_title = "Pass it on"
share_text = "BUILD packs the program and your game into one zip file in the game's <code>builds</code> folder, ready to give to a friend."
next_title = "Where next"
next_help = "HELP in the IDE shows the Lua API by example: whole games to copy and change."
next_games = "The five games lie in the <code>games</code> folder beside the program: EDIT in the launcher opens one, to see how it is made."
next_console = "While a game plays, the key left of 1 opens the console: a line of Lua runs in the game, <code>player.state.score = 5000</code> for instance."


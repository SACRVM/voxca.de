links_title = "Links"
links_text = "This site links to external websites, GitHub for instance, whose content I have no influence over. The respective provider is always responsible for that content. No legal violations were apparent at the time of linking; should one become known, I will remove the link promptly."
copyright_title = "Copyright"
copyright_text = "Content and works made by the site operator are subject to German copyright law. Voxcade itself, its games and templates are free to use under the <a href=\"/license.txt\">zlib licence</a>. The Microban puzzles in Sokovox are by David W. Skinner, passed on with his credit as he asks."
privacy = "Cookies &amp; tracking"
privacy_short = "Short version: none of it."
privacy_text = "This site sets no cookies, so there is no cookie banner: where nothing is collected, there is nothing to consent to. No analytics, no trackers, no forms, and nothing loaded from other servers: the fonts, pictures and films all live on this host."
hosting_text = "What remains are the technical server logs of the hosting provider (GitHub Pages, GitHub Inc.), which include the requesting IP address; details are in the <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\">GitHub Privacy Statement</a>. The downloads come from GitHub's release storage, so GitHub's servers see that request as well. Voxcade itself asks this site for one small file when its launcher starts, to learn of a new version (that can be switched off in the launcher); this request reaches GitHub's servers like a page view. Nothing else is sent."
back = "Back to Voxcade"

